<title>Mundo dos iPhones</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
.so-pc{display:none!important}
:root{
  --bg:#f3f6f4;--surface:#ffffff;--elevated:#f6f9f7;--muted:#ecf1ee;--border:#dfe7e2;
  --text:#22322b;--strong:#0e1f18;--soft:#5b6e65;--dim:#94a39b;
  --primary:#0f8f5f;--primary-soft:#e2f4ec;--side:#0b3b2a;--gold:#b8e35a;--gold-soft:#f0f9dc;
  --ok:#13814f;--ok-soft:#e3f3ea;--bad:#c2372c;--bad-soft:#fbe7e5;--warn:#b06f12;--warn-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(14,31,24,.06),0 4px 14px rgba(14,31,24,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:var(--strong)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:'DM Mono',ui-monospace,monospace;font-size:12px}
.disp{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
[hidden]{display:none!important}

/* barra do protótipo (só em tela larga) */
.proto{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;padding:8px 16px;font-size:12px;color:var(--soft)}
.proto .so-larga{display:none}
@media (min-width:760px){.proto .so-cel{display:none}}
.proto{padding-block:6px}
.proto .perfil b{font-weight:600}
/* comparação de menus */
.sheet.larga{max-width:860px}
.cmp{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media (min-width:700px){.cmp{grid-template-columns:1fr 1fr}}
.cmp>section{border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--bg)}
.cmp h4{margin:0;font-size:15px;color:var(--strong)}
.cmp .quem{display:flex;align-items:center;gap:10px}
.mtabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding-top:6px;box-shadow:var(--shadow)}
.mtabs>span{flex:1;min-width:0;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--soft);position:relative;white-space:nowrap}
.mtabs>span.on{color:var(--primary)}
.mtabs>span .icon{width:20px;height:20px}
.mtabs .fab{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--side),var(--primary));color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(15,143,95,.35)}
.mlist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.mlist>span{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;color:var(--strong);border-top:1px solid var(--border)}
.mlist>span:first-child{border-top:0}
.mlist>span.mgrupo{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;background:var(--bg);padding:6px 12px}
.mlist>span .icon{width:17px;height:17px;color:var(--soft)}
.mlist>span .small{margin-left:auto}
.mlist .grupo{background:var(--muted);font-size:11px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;padding:5px 12px}
.recibo{margin-top:12px;border:1px dashed var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--elevated)}
.rc-valor{border-block:1px solid var(--border);padding-block:10px}
.simtab .li{padding:9px 16px;text-align:left;width:100%}
.simtab .li.on{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
/* deixa claro o que é clicável */
button.li,button.card,.cob button.mid,.fones button.fone,.side .item{cursor:pointer;transition:background-color .12s,border-color .12s,box-shadow .12s}
@media (hover:hover){
  button.li:hover,.list>button.li:hover{background:var(--muted)}
  button.li:hover .icon:last-child{color:var(--primary)}
  .cob:has(button.mid:hover){background:var(--muted)}
  button.card:hover,.fones button.fone:hover{border-color:color-mix(in oklab,var(--primary) 45%,var(--border));box-shadow:0 6px 18px rgba(15,143,95,.12)}
  .simtab .li:hover{background:var(--muted)}
}
button.li:focus-visible,button.card:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.pode{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--strong)}
.pode li{display:flex;gap:8px;align-items:flex-start}
.pode li .icon{width:15px;height:15px;flex:none;margin-top:2px;color:var(--ok)}
.pode li.nao .icon{color:var(--bad)}
.proto b{color:var(--strong)}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto}
.abas button{display:flex;align-items:center;gap:7px;padding:9px 14px 10px;font-size:14px;font-weight:600;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.abas button .icon{width:17px;height:17px}
.abas button{flex:1 0 auto;justify-content:center;padding-inline:8px}
.abas button .icon{display:none}
@container (min-width:560px){.abas button{flex:0 0 auto;padding-inline:14px}.abas button .icon{display:block}}
.abas button.on{color:var(--primary);border-bottom-color:var(--primary)}
.abas button .n{font-size:11px;font-weight:600;background:var(--muted);color:var(--soft);border-radius:99px;padding:1px 7px}
.abas button.on .n{background:color-mix(in oklab,var(--primary) 14%,transparent);color:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal.sem{margin-bottom:4px}.cal.sem span{font-size:11px;font-weight:600;color:var(--dim);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.cal .d{min-height:54px;border-radius:9px;border:1px solid var(--border);background:var(--surface);padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:12px;min-width:0}
.cal .d .n{font-weight:600;color:var(--strong)}.cal .d .v{font-size:11px;font-weight:700;font-family:'DM Mono',ui-monospace,monospace}.cal .d .q{display:none;font-size:10.5px;color:var(--dim)}
.cal .d.hoje{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}.cal .d.sel{background:var(--primary-soft);border-color:var(--primary)}
@container (min-width:640px){.cal .d{min-height:74px;padding:7px 8px}.cal .d .v{font-size:12.5px}.cal .d .q{display:block}}
.barras{display:flex;align-items:flex-end;gap:8px;margin-top:14px}
.barras .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.barras .bs{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%}
.barras .bs span{flex:1;max-width:18px;border-radius:4px 4px 1px 1px}
.barras .hj{color:var(--strong);font-weight:700}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--soft)}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px}
.tab-x{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tb th{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tb td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--strong);white-space:nowrap}
.tb .r{text-align:right}.tb tfoot td{font-weight:700;border-bottom:0;background:var(--muted)}
.pilha{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}.pilha i{display:block;min-width:3px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--border);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--primary)}.sw.on::after{left:21px}
.qr{display:grid;grid-template-columns:repeat(21,6px);grid-template-rows:repeat(21,6px);padding:10px;background:#fff;border:1px solid var(--border);border-radius:10px}.qr i{background:#111}
.bolha{background:#dcf8c6;color:#111;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;line-height:1.45;max-width:420px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap}
.rep-op .dir{text-align:right;white-space:nowrap}
@container (max-width:559px){.rep-op{flex-wrap:wrap}.rep-op .dir{flex-basis:100%;text-align:left;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rep-op .dir>*{display:inline!important}}
.selo{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.selo.g{font-size:13px;padding:4px 10px 4px 8px}.selo .i-sm{width:13px;height:13px}
.niveis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container (min-width:880px){.niveis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.niv{border:1.5px solid;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.banner-ind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--side);color:#fff;font-size:12.5px}
.banner-ind span{flex:1;min-width:180px}.banner-ind .btn{background:var(--gold);color:var(--side);height:30px}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:4px}
.escada{display:flex;flex-direction:column;gap:10px}
.degrau{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface)}
.degrau.atual{border-color:var(--c);background:var(--f)}
.degrau .marco{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--border);color:#fff}
.degrau.feito .marco{background:var(--c);border-color:var(--c)}
.ct-grid{display:grid;gap:12px}
@container (min-width:880px){.ct-grid{grid-template-columns:minmax(0,1fr) 300px}}
.duo{display:grid;gap:12px}
@container (min-width:640px){.duo{grid-template-columns:1fr 1fr}}
.ta{width:100%;min-height:440px;font:12.5px/1.65 'DM Mono',ui-monospace,monospace;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface);color:var(--strong);resize:vertical}
.ta:focus{outline:2px solid color-mix(in oklab,var(--primary) 40%,transparent);outline-offset:1px}
.papel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;font:12px/1.7 'DM Mono',ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--strong);max-height:48dvh;overflow:auto;box-shadow:inset 0 1px 0 var(--border)}
.papel mark{background:var(--primary-soft);color:var(--primary);border-radius:4px;padding:0 3px}
.papel mark.f{background:var(--warn-soft);color:var(--warn)}
.passos{display:flex;flex-direction:column;margin-top:14px}
.passos>div{display:flex;gap:10px;position:relative;padding-bottom:12px;color:var(--soft)}
.passos>div:not(:last-child)::after{content:'';position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--border)}
.passos>div.ok{color:var(--strong)}
.passos .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--border);background:var(--surface)}
.passos .ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.aviso{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:500}
.pill:disabled{opacity:.5}
.seg{display:inline-flex;background:var(--muted);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--soft);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--strong);box-shadow:var(--shadow)}
@media (min-width:760px){.proto .so-larga{display:inline-flex}}

.stage{height:100%;display:flex;flex-direction:column}
.app{flex:1;min-height:0;container-type:inline-size;margin:0 auto;width:100%;background:var(--bg)}
@media (min-width:760px){
  .stage.celular .app{flex:none;width:390px;height:min(820px,calc(100% - 64px));border-radius:34px;border:10px solid #0b1222;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
}
.shell{height:100%;display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr;overflow:hidden}

/* barra lateral (computador) */
.side{display:none}
.main{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top h1{margin:0;font-size:18px;font-weight:700;color:var(--strong);flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--side),var(--primary));display:grid;place-items:center;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary);flex:none}
.content{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1180px;margin:0 auto;width:100%}

.tabs{display:flex;border-top:1px solid var(--border);background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--soft);position:relative}
.tabs button.on{color:var(--primary)}
.tabs button.on::before{content:'';position:absolute;top:0;left:50%;width:30px;height:3px;border-radius:0 0 3px 3px;background:var(--primary);transform:translateX(-50%)}
.tabs .vender span.fab{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--side),var(--primary));color:#fff;display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 16px rgba(15,143,95,.35)}
.tabs .vender.on::before{display:none}
.badge-dot{position:absolute;top:7px;left:calc(50% + 4px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:600;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--surface)}

@container (min-width:880px){
  .shell{grid-template-columns:236px 1fr;grid-template-rows:1fr}
  .side{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--border);color:var(--text);padding:16px 12px;grid-row:1;overflow-y:auto;min-height:0}
  .tabs{display:none}
  .top .avatar.mais,.logo-m{display:none}
  .so-pc.so-pc{display:inline-flex!important}
  .content{padding:24px}
}
.side .marca{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:800;font-size:16px;color:var(--strong);letter-spacing:-.01em;line-height:1.1}
.side .marca em{font-style:normal;color:var(--primary)}
.side .titulo{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 10px 4px;font-weight:600}
.side .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14px;text-align:left;width:100%}
.side .item:hover{background:var(--muted)}
.side .item.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side .item .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:600;border-radius:9px;padding:1px 6px}
.side .novo{margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(15,143,95,.25)}
.side>*{flex-shrink:0}
.side .fundo{margin-top:auto;padding-top:10px}
.side .fundo+.rod{margin-top:0}
.side .rod{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid var(--border);font-size:13px}

/* peças */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 -8px}
.inicio,.inicio>.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-t h2{margin:0;font-size:14px;font-weight:600;color:var(--strong)}
.sec-t button{font-size:13px;color:var(--primary);font-weight:500}
.lbl{font-size:12px;color:var(--soft)}
.val{font-weight:600;color:var(--strong)}
.small{font-size:12px;color:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-pri{background:var(--primary-soft);color:var(--primary)}.c-neu{background:var(--muted);color:var(--soft)}.c-gold{background:var(--gold-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.97)}
.b-pri{background:var(--primary);color:#fff}
.b-sub{background:var(--muted);color:var(--strong)}
.b-ok{background:var(--ok);color:#fff}
.b-ghost{color:var(--soft)}
.b-out{border:1px solid var(--border);background:var(--surface);color:var(--strong)}
.b-sm{height:32px;padding:0 11px;font-size:12px;border-radius:9px}
.b-block{width:100%;height:46px;font-size:15px;border-radius:12px}
.icon{width:18px;height:18px;flex:none}
.i-sm{width:15px;height:15px}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--border)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:500;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;background:var(--muted);color:var(--strong)}
.bar{height:6px;border-radius:9px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--primary)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.empty{padding:28px 16px;text-align:center;color:var(--soft)}

/* início */
.hero{border-radius:18px;padding:16px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,rgba(184,227,90,.32),transparent 55%),linear-gradient(135deg,var(--side),var(--primary));display:flex;flex-direction:column;gap:12px}
.hero .lbl{color:rgba(255,255,255,.75)}
.hero .big{font-size:30px;font-weight:800;line-height:1.1}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .acts .btn{background:rgba(255,255,255,.14);color:#fff}
.hero .acts .btn.gold{background:var(--gold);color:#13240c}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.kpis>button,.kpis>div{background:var(--surface);padding:11px 12px;text-align:left;min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.kpis .lbl,.kpis .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis .val{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (min-width:880px){
  .inicio{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
  .kpis .val{font-size:18px}
}

}
function somaDiasUteis(iso, n) {
  const d = new Date(iso + 'T12:00:00Z'); let k = 0
  while (k < n) { d.setUTCDate(d.getUTCDate() + 1); if (d.getUTCDay() !== 0) k++ }
  return d.toISOString().slice(0, 10)
}
// Frequência do pagamento. Diária pula domingo.
const FREQ = {
  MENSAL: { label: 'Mensal', por: 'ao mês', cada: 'todo mês', qtd: [3, 4, 6, 10, 12] },
  QUINZENAL: { label: 'Quinzenal', por: 'por quinzena', cada: 'a cada 15 dias', qtd: [2, 4, 6, 8, 12] },
  SEMANAL: { label: 'Semanal', por: 'por semana', cada: 'toda semana', qtd: [4, 6, 8, 12, 16] },
  DIARIA: { label: 'Diária', por: 'no total', cada: 'todo dia menos domingo', qtd: [20, 24, 30] },
}
const pulaDomingo = (iso) => (new Date(iso + 'T12:00:00Z').getUTCDay() === 0 ? somaDias(iso, 1) : iso)
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10) }
// 1º vencimento padrão: um período depois da data do empréstimo
function primeiroVenc(data, freq) {
  if (freq === 'QUINZENAL') return somaDias(data, 15)
  if (freq === 'SEMANAL') return somaDias(data, 7)
  if (freq === 'DIARIA') return somaDiasUteis(data, 1)
  return somaMes(data, 1, Number(data.slice(8, 10)))
}
function vencimentos(primeira, freq, n) {
  if (freq === 'DIARIA') { const p0 = pulaDomingo(primeira); return Array.from({ length: n }, (_, i) => (i ? somaDiasUteis(p0, i) : p0)) }
  const passo = freq === 'QUINZENAL' ? 15 : freq === 'SEMANAL' ? 7 : 0
  return Array.from({ length: n }, (_, i) => (passo ? somaDias(primeira, passo * i) : somaMes(primeira, i, Number(primeira.slice(8, 10)))))
}
// Parcelado: juros simples por período (mês, quinzena ou semana) sobre o capital.
// Só juros: paga o juro a cada período e o capital junto da última.
// Diária: capital + juros no total, divididos em parcelas diárias (sem domingo).
function planoEmprestimo({ capital, mod, taxa, n, data, freq, primeira }) {
  const c = Number(capital) || 0, t = (Number(taxa) || 0) / 100
  freq = mod === 'DIARIA' ? 'DIARIA' : freq || 'MENSAL'
  const vs = vencimentos(primeira || primeiroVenc(data, freq), freq, n)
  if (mod === 'JUROS') return vs.map((venc, i) => ({ venc, valor: Math.round(c * t * 100) / 100 + (i === n - 1 ? c : 0) }))
  const parc = mod === 'DIARIA' ? Math.ceil(c * (1 + t) / n * 100) / 100 : Math.ceil(c * (1 + t * n) / n * 100) / 100
  return vs.map((venc) => ({ venc, valor: parc }))
}

function criarEmp({ clienteId, data, capital, mod, taxa, n, parceiroId = 0, pagarAte = null, freq = 'MENSAL', primeira = null }) {
  if (mod === 'DIARIA') freq = 'DIARIA'

// lucro realizado por mês: capital volta primeiro, o que passa é lucro (só a sua parte quando tem parceiro)
function lucroPorMes() {
  const meses = {}
  for (const o of [...vendas, ...emprestimos]) {
    const k = contasOp(o), pct = pctOp(o)
    const ent = o.tipo === 'EMP' ? [] : [{ data: o.data, valor: o.entrada + o.troca }]
    const lanc = [...ent, ...o.parcelas.flatMap((p) => p.pagos)].sort((a, b) => a.data.localeCompare(b.data))

    for (const l of lanc) {
      const antes = acum; acum += l.valor
      const lucro = Math.max(0, acum - Math.max(antes, k.inv))
      if (lucro > 0) meses[l.data.slice(0, 7)] = (meses[l.data.slice(0, 7)] || 0) + lucro * (1 - pct)

  }
  return meses
}

function preencher(texto, v, marcar = true) {
  const x = { v, k: contas(v), c: cliente(v.clienteId), b: bem(v.bemId) }; x.d = docCliente(x.c)
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  const faltam = new Set()
  const html = esc(texto).replace(/\{\{(\w+)\}\}/g, (m, k) => {
    const def = VAR_MAP[k]; if (!def) return marcar ? `<mark class="f">${m}</mark>` : m
    const val = def.f(x)
    if (!val) { faltam.add(def.r); return marcar ? `<mark class="f">${def.r} não cadastrado</mark>` : '' }
    return marcar ? `<mark>${esc(val)}</mark>` : esc(val)
  })
  return { html, faltam: [...faltam] }
}

function cliquesContratos(t, d) {
  if (d.ctaba) { S.ctAba = d.ctaba; render(); return true }
  if (d.ctf) { S.ctFiltro = d.ctf; render(); return true }
  if (d.contrato) { abrir('contrato', Number(d.contrato)); return true }
  if (d.ctPrev != null) { const ta = document.getElementById('ctTexto'); if (ta) S.ctModelo = ta.value; S.ctPrev = d.ctPrev === '1'; render(); return true }
  if (d.ctVar) {
    const ta = document.getElementById('ctTexto'); if (!ta) return true
    const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a, ins = `{{${d.ctVar}}}`
    ta.value = ta.value.slice(0, a) + ins + ta.value.slice(b); S.ctModelo = ta.value
    ta.focus(); ta.setSelectionRange(a + ins.length, a + ins.length); return true
  }
  if ('ctPadrao' in d) { S.ctModelo = MODELO_PADRAO; render(); toast('Modelo padrão de volta. Salve para valer.'); return true }
  if ('ctSalvar' in d) { const ta = document.getElementById('ctTexto'); if (ta) S.ctModelo = ta.value; S.ctVersao = (S.ctVersao || 3) + 1; render(); toast(`Modelo salvo · versão ${S.ctVersao}`); return true }
  if ('empSalvar' in d) {
    const val = (id) => document.getElementById(id).value.trim(), num = (id) => Number(val(id).replace(/\./g, '').replace(',', '.')) || 0
    Object.assign(EMPRESA, { nome: val('eNome'), cnpj: val('eCnpj'), email: val('eEmail'), atendente: val('eAtend'), endereco: val('eEnd'), avaria: num('tAvaria'), reposicao: num('tRepo'), seguro: num('tSeguro'), cancelamento: num('tCanc'), recuperacao: num('tRecup') })
    toast('Dados da empresa e taxas salvos'); return true
  }
  if (d.ctReenviar) { toast(`Link de assinatura reenviado para ${cliente(vendas.find((v) => v.id === Number(d.ctReenviar)).clienteId).fone}`); return true }
  if (d.ctLink) { try { navigator.clipboard.writeText(`https://app.zapsign.com.br/verificar/exemplo-${d.ctLink}`).catch(() => {}) } catch {} toast('Link de assinatura copiado'); return true }
  if (d.ctPdf) { toast('No sistema de verdade, abre o PDF assinado'); return true }
  if (d.ctSinc) { const v = vendas.find((x) => x.id === Number(d.ctSinc)); v.contrato = 'ASSINADO'; S.folha = { tipo: 'contrato', arg: v.id }; render(); toast('Conferido na ZapSign: assinado'); return true }
  return false
}

// calendário do mês: serve pro admin (Cronograma) e pro indicador (Cobrança › Calendário)
function cronCalendario(todas, linha) {
  const ym = S.cronMes || HOJE.slice(0, 7)
  const doMes = todas.filter((x) => x.p.venc.slice(0, 7) === ym)
  const previsto = doMes.reduce((s, x) => s + x.p.valor, 0)
  const recebido = doMes.reduce((s, x) => s + pagoP(x.p), 0)
  const atrasado = doMes.filter((x) => !x.p.pago && x.p.venc < HOJE).reduce((s, x) => s + faltaP(x.p), 0)
  const [y, m] = ym.split('-').map(Number)
  const primeiro = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), dias = new Date(Date.UTC(y, m, 0)).getUTCDate()
  const sel = S.cronDia && S.cronDia.slice(0, 7) === ym ? S.cronDia : (ym === HOJE.slice(0, 7) ? HOJE : null)
  const cel = []
  for (let i = 0; i < primeiro; i++) cel.push('<span></span>')
  for (let d = 1; d <= dias; d++) {
    const iso = `${ym}-${String(d).padStart(2, '0')}`, xs = doMes.filter((x) => x.p.venc === iso)
    const aberto = xs.filter((x) => !x.p.pago), tot = xs.reduce((s, x) => s + (x.p.pago ? pagoP(x.p) : faltaP(x.p)), 0)
    const cor = !xs.length ? '' : aberto.some((x) => iso < HOJE) ? 'var(--bad)' : aberto.length ? (iso === HOJE || diasEntre(HOJE, iso) <= 7 ? 'var(--warn)' : 'var(--dim)') : 'var(--ok)'
    cel.push(`<button class="d ${iso === HOJE ? 'hoje' : ''} ${iso === sel ? 'sel' : ''}" data-cron-dia="${iso}"><span class="n">${d}</span>${xs.length ? `<span class="v num" style="color:${cor}">${kfmt(tot)}</span><span class="q">${xs.length} ${xs.length === 1 ? 'parcela' : 'parcelas'}</span>` : ''}</button>`)
  }
  const doDia = sel ? doMes.filter((x) => x.p.venc === sel) : []
  return `<div class="between" style="gap:8px"><div class="row" style="gap:6px"><button class="btn b-out b-sm" data-cron-mes="-1" aria-label="Mês anterior">${ic('chevron-left', 'i-sm')}</button><b style="color:var(--strong);font-size:15px;min-width:140px;text-align:center;text-transform:capitalize">${mesLabel(ym)}</b><button class="btn b-out b-sm" data-cron-mes="1" aria-label="Próximo mês">${ic('chevron-right', 'i-sm')}</button></div>${ym !== HOJE.slice(0, 7) ? '<button class="btn b-ghost b-sm" data-cron-mes="0">Hoje</button>' : ''}</div>
    <div class="resumo3"><div><div class="lbl">Previsto</div><div class="val num">${fmt0(previsto)}</div></div><div><div class="lbl">Recebido</div><div class="val num" style="color:var(--ok)">${fmt0(recebido)}</div></div><div><div class="lbl">Em atraso</div><div class="val num" style="color:${atrasado ? 'var(--bad)' : 'var(--strong)'}">${fmt0(atrasado)}</div></div></div>
    <div class="card pad"><div class="cal sem">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map((d) => `<span>${d}</span>`).join('')}</div><div class="cal">${cel.join('')}</div>
      <div class="small" style="margin-top:10px">Vermelho atrasado · laranja vence esta semana · verde pago</div></div>
    ${sel ? `<div class="card"><div class="totbar"><b style="color:var(--strong)">${Number(sel.slice(8))} de ${MESES[Number(sel.slice(5, 7)) - 1]}</b><span class="small">${doDia.length ? `${doDia.length} ${doDia.length === 1 ? 'parcela' : 'parcelas'}` : 'nada vence neste dia'}</span></div>${doDia.length ? `<div class="list">${doDia.map(linha).join('')}</div>` : ''}</div>` : ''}`
}

function mesesJanela(de, ate) { const out = []; for (let i = de; i <= ate; i++) out.push(somaYm(HOJE.slice(0, 7), i)); return out }
function colocadoPorMes() {
  const m = {}
  for (const v of vendas) { const k = v.data.slice(0, 7); m[k] = (m[k] || 0) + investido(bem(v.bemId)) }
  for (const e of emprestimos) { const k = e.data.slice(0, 7); m[k] = (m[k] || 0) + e.capital }
  return m
}
function recebidoPorMes() {
  const m = {}
  for (const o of [...vendas, ...emprestimos]) {
    if (o.tipo !== 'EMP' && o.entrada + o.troca) m[o.data.slice(0, 7)] = (m[o.data.slice(0, 7)] || 0) + o.entrada + o.troca
    for (const p of o.parcelas) for (const g of p.pagos) m[g.data.slice(0, 7)] = (m[g.data.slice(0, 7)] || 0) + g.valor
  }
  return m
}
function barras(series, meses, alt = 130) {
  const max = Math.max(1, ...meses.flatMap((k) => series.map((s) => s.d[k] || 0)))
  return `<div class="barras" style="height:${alt + 34}px">${meses.map((k) => `<div class="col"><div class="bs" style="height:${alt}px">${series.map((s) => `<span title="${s.l} ${fmt0(s.d[k] || 0)}" style="height:${Math.max(2, (s.d[k] || 0) / max * alt)}px;background:${s.c}"></span>`).join('')}</div><span class="small ${k === HOJE.slice(0, 7) ? 'hj' : ''}">${mesCurto(k)}</span></div>`).join('')}</div>
    <div class="leg">${series.map((s) => `<span><i style="background:${s.c}"></i>${s.l}</span>`).join('')}</div>`
}
function tabela(cab, linhas, total) {
  return `<div class="tab-x"><table class="tb"><thead><tr>${cab.map((c, i) => `<th${i ? ' class="r"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${linhas.map((l) => `<tr>${l.map((c, i) => `<td${i ? ' class="r num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody>${total ? `<tfoot><tr>${total.map((c, i) => `<td${i ? ' class="r num"' : ''}>${c}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`
}
function relLucro() {
  const meses = mesesJanela(-5, 0), col = colocadoPorMes(), rec = recebidoPorMes(), luc = lucroPorMes()
  const grupos = [['iPhones', vendas], ['Empréstimos', emprestimos]].map(([l, ops]) => {
    const ks = ops.map(contasOp)
    const inv = ks.reduce((s, k) => s + k.inv, 0), recb = ks.reduce((s, k) => s + k.recebido, 0), real = ks.reduce((s, k) => s + k.lucroRealizado, 0), vir = ks.filter((k) => k.status === 'ATIVA').reduce((s, k) => s + Math.max(0, k.seuLucro - k.lucroRealizado), 0)
    return [l, inv, recb, real, vir, ks.reduce((s, k) => s + Math.max(0, k.seuLucro), 0) / Math.max(1, inv)]
  })
  return `<div class="card pad"><div class="between"><b style="color:var(--strong)">Dinheiro que saiu, voltou e virou lucro</b><span class="small">últimos 6 meses</span></div>
      ${barras([{ l: 'Investido', d: col, c: 'var(--dim)' }, { l: 'Recebido', d: rec, c: 'var(--primary)' }, { l: 'Seu lucro', d: luc, c: 'var(--gold)' }], meses)}</div>
    <div class="card">${tabela(['', 'Investido', 'Recebido', 'Lucro no bolso', 'Lucro por vir', 'Retorno'], grupos.map(([l, a, b, c, d, r]) => [`<b>${l}</b>`, fmt0(a), fmt0(b), `<span style="color:var(--ok)">${fmt0(c)}</span>`, fmt0(d), `${Math.round(r * 100)}%`]),
      ['<b>Total</b>', fmt0(grupos.reduce((s, g) => s + g[1], 0)), fmt0(grupos.reduce((s, g) => s + g[2], 0)), fmt0(grupos.reduce((s, g) => s + g[3], 0)), fmt0(grupos.reduce((s, g) => s + g[4], 0)), ''])}</div>
    <p class="small" style="margin:0">Retorno = seu lucro total ÷ o que você investiu. Com indicador, conta só a sua parte.</p>`
}
function relCapital() {
  const meses = mesesJanela(-5, 0), col = colocadoPorMes()
  const saldo = movimentos().reduce((s, m) => s + (m.ent ? m.valor : -m.valor), 0)

  const partes = [['Em caixa', Math.max(0, saldo), 'var(--gold)'], ['No estoque', estoque, 'var(--dim)'], ['Vendas na rua', naRua(vendas), 'var(--primary)'], ['Empréstimos na rua', naRua(emprestimos), 'var(--side)']]

function relIndicador() {
  const linhas = parceiros.map((p) => {
    const ops = [...vendas, ...emprestimos].filter((o) => o.parceiroId === p.id), ks = ops.map(contasOp)
    const lt = ks.reduce((s, k) => s + Math.max(0, k.lucroTotal), 0), dele = ks.reduce((s, k) => s + Math.max(0, k.lucroTotal) * k.p.pct, 0)

function relMensal() {

function relBalancete() {

function rgPreview() {
  const o = opById(S.rg.id), abertas = o.parcelas.filter((p) => !p.pago), saldo = abertas.reduce((s, x) => s + faltaP(x), 0)

function salvarReneg() {
  const r = S.rg, o = opById(r.id)
  if (r.modo === 'venc') {
    const p = o.parcelas.find((x) => x.n === r.n), dias = diasEntre(p.venc, r.data), antes = p.venc
    for (const x of o.parcelas.filter((x) => !x.pago && (x.n === r.n || (r.empurrar && x.n > r.n)))) { x.vencOriginal ||= x.venc; x.venc = addDia(x.venc, dias) }
    S.rg = null; abrir(o.tipo === 'EMP' ? 'emprestimo' : 'venda', o.id); render()
    toast(`${p.n}ª parcela passou de ${dmy(antes)} para ${dmy(p.venc)}${r.empurrar ? ', e as próximas junto' : ''}`); return
  }
  const abertas = o.parcelas.filter((p) => !p.pago), saldo = abertas.reduce((s, x) => s + faltaP(x), 0)
  const acresc = Number(String(r.acresc).replace(/\./g, '').replace(',', '.')) || 0, valor = Math.round((saldo + acresc) / r.qtd * 100) / 100
  // parcela com pagamento parcial fecha no que já pagou; as outras abertas saem e entram as novas
  for (const p of abertas) if (pagoP(p) > 0) { p.valor = pagoP(p); p.desconto = 0; p.pago = p.pagos.at(-1).data }
  o.parcelas = o.parcelas.filter((p) => p.pago)
  const base = o.parcelas.length, dia = Number(r.primeira.slice(8))
  for (let i = 0; i < r.qtd; i++) o.parcelas.push({ n: base + i + 1, venc: i ? somaMes(r.primeira, i, dia) : r.primeira, valor, pago: null, pagos: [], desconto: 0 })
  ;(o.ajustes ||= []).push({ data: HOJE, tipo: o.tipo === 'EMP' ? 'ACORDO' : 'REPARCELAMENTO', de: abertas.length, para: r.qtd, acresc })
  S.rg = null; abrir(o.tipo === 'EMP' ? 'emprestimo' : 'venda', o.id); render()
  toast(`${o.tipo === 'EMP' ? 'Acordo fechado' : 'Reparcelado'}: ${r.qtd}x de ${fmt(valor)}`)
}

// ----- Controle de repasses: capital volta primeiro, depois o indicador leva o % dele do lucro -----
// Pagamentos são por indicador; aqui eles abatem as operações em ordem de data, pra mostrar o que falta em cada uma.
function repassesDoIndicador(pid) {
  const ops = [...vendas, ...emprestimos].filter((o) => o.parceiroId === pid).sort((a, b) => a.data.localeCompare(b.data))
  let pago = repassesPagos.filter((r) => r.parceiroId === pid).reduce((s, r) => s + r.valor, 0)
  const linhas = ops.map((o) => {
    const k = contasOp(o), pc = pctOp(o)
    const liberado = Math.max(0, k.recebido - k.inv), parte = Math.round(liberado * pc * 100) / 100
    const usado = Math.min(parte, pago); pago -= usado
    return { o, k, pc, liberado, parte, pago: usado, aPagar: Math.round((parte - usado) * 100) / 100, parteTotal: Math.max(0, k.lucroTotal) * pc, volta: voltaDoCapital(o, k) }
  })
  const pagos = repassesPagos.filter((r) => r.parceiroId === pid)
  return { linhas, aPagar: linhas.reduce((s, l) => s + l.aPagar, 0), sobra: Math.max(0, pago), liberado: linhas.reduce((s, l) => s + l.parte, 0), jaPago: pagos.reduce((s, r) => s + r.valor, 0), ultimo: pagos.map((r) => r.data).sort().at(-1), vaiGanhar: linhas.reduce((s, l) => s + l.parteTotal, 0) }
}
// em qual parcela o capital termina de voltar (pelo plano), e quanto cada parcela libera depois disso
function voltaDoCapital(o, k) {
  let acum = o.tipo === 'EMP' ? 0 : o.entrada + o.troca
  if (acum >= k.inv) return { jaVoltou: true }
  for (const p of o.parcelas) { acum += p.valor; if (acum >= k.inv) return { jaVoltou: k.capitalDeVolta >= k.inv, n: p.n, venc: p.venc, de: o.parcelas.length } }
  return { nunca: true }
}
function previsaoRepasse(pid, meses) {
  const m = Object.fromEntries(meses.map((k) => [k, 0]))
  for (const o of [...vendas, ...emprestimos].filter((x) => x.parceiroId === pid)) {
    const k = contasOp(o), pc = pctOp(o)
    let acum = k.recebido
    for (const p of o.parcelas.filter((x) => !x.pago).sort((a, b) => a.venc.localeCompare(b.venc))) {
      const antes = acum; acum += faltaP(p)
      const lucro = Math.max(0, acum - Math.max(antes, k.inv)), ym = (p.venc < HOJE ? HOJE : p.venc).slice(0, 7)
      if (lucro > 0 && ym in m) m[ym] += lucro * pc
    }
  }
  return m
}

  if (d.repHist) { S.indAba = 'historico'; S.histInd = Number(d.repHist); render(); return true }
  if (d.indaba) { S.indAba = d.indaba; render(); return true }
  if (d.repasse) { S.pr = null; abrir('pagarRepasse', Number(d.repasse)); return true }
  if (d.prForma) { S.pr.forma = d.prForma; renderCamada(); return true }
  if ('prWa' in d) { S.pr.wa = !S.pr.wa; renderCamada(); return true }
  if ('prSalvar' in d) {
    const x = S.pr, v = Math.round(numBR(x.valor) * 100) / 100; if (!(v > 0)) return true
    const p = parceiro(x.pid); repassesPagos.push({ parceiroId: x.pid, data: x.data, valor: v, forma: x.forma })
    S.pr = null; S.folha = null; render(); toast(`Repasse de ${fmt(v)} para ${p.nome} registrado${x.wa ? ' · extrato enviado' : ''}`); return true
  }
  if (d.repDesfazer) { const r = repassesPagos.splice(Number(d.repDesfazer), 1)[0]; render(); toast(`Repasse de ${fmt(r.valor)} desfeito`); return true }
  return false
}

function inputsPortal(t) {

const GRUPOS = [
  { titulo: 'Dia a dia', ids: ['inicio', 'cobrancas', 'cronograma', 'caixa', 'simulador'] },
  { titulo: 'Cadastros', ids: ['clientes', 'estoque', 'vendas', 'contratos'] },
  { titulo: 'Gestão', ids: ['indicadores', 'equipe', 'relatorios'] },
]
const itemNav = (id) => [...NAV, ...MAIS].find((n) => n.id === id)
const TITULO = { simulador: 'Simulador', inicio: 'Início', cobrancas: 'Cobranças', vender: 'Nova venda', estoque: 'Estoque', vendas: 'Operações', clientes: 'Clientes', cliente: 'Cliente', emprestimos: 'Empréstimos', caixa: 'Caixa', contratos: 'Contratos', cronograma: 'Cronograma', relatorios: 'Relatórios', indicadores: 'Indicadores', config: 'Configurações', equipe: 'Equipe' }

function itemSide(n, atr) {
  const on = S.tela === n.id || (n.id === 'clientes' && S.tela === 'cliente')
  const cnt = n.id === 'cobrancas' && atr ? `<span class="cnt">${atr}</span>` : n.id === 'equipe' && aprovacoes.length ? `<span class="cnt" style="background:var(--warn)">${aprovacoes.length}</span>` : ''
  return `<button class="item ${on ? 'on' : ''}" data-mais="${n.id}">${ic(n.icon)}${n.label}${cnt}</button>`
}
function qtdAtraso() { return new Set(cobrancas().filter((x) => !x.p.pago && x.p.venc < HOJE).map((x) => x.v.id)).size }

function shell() {
  if (S.modo === 'indicador') return portalShell()
  if (S.modo === 'equipe') return equipeShell()
  const atr = qtdAtraso()
  const side = `
    <aside class="side">
      <div class="marca">${logo()}<span>Mundo dos<br><em>iPhones</em></span></div>
      <button class="novo" data-folha="novo">${ic('plus')}Novo</button>
      ${GRUPOS.map((g) => `<div class="titulo">${g.titulo}</div>${g.ids.map((id) => itemSide(itemNav(id), atr)).join('')}`).join('')}
      <div class="fundo">${itemSide(itemNav('config'), atr)}</div>
      <div class="rod"><span class="avatar">GC</span><div><div style="color:var(--strong);font-weight:600">Geovane</div><div style="font-size:11px;color:var(--dim)">Administrador</div></div></div>
    </aside>`
  const NAVM = NAV.filter((n) => n.id !== 'vendas')
  const noMais = !NAVM.some((n) => n.id === S.tela)
  const tabs = `<nav class="tabs">${NAVM.map((n) => n.id === 'vender'
    ? `<button class="vender ${S.tela === 'vender' ? 'on' : ''}" data-folha="novo"><span class="fab">${ic('plus')}</span>Novo</button>`
    : `<button class="${S.tela === n.id ? 'on' : ''}" data-ir="${n.id}">${ic(n.icon, 'icon')}${n.label}${n.id === 'cobrancas' && atr ? `<span class="badge-dot">${atr}</span>` : ''}</button>`).join('')}<button class="${noMais ? 'on' : ''}" data-folha="mais">${ic('menu')}Mais</button></nav>`
  return `${side}<div class="main"><header class="top">${S.tela === 'cliente' ? `<button class="avatar" style="background:var(--muted);color:var(--strong)" data-mais="clientes" aria-label="Voltar">${ic('chevron-left')}</button>` : `<span class="logo-m">${logo(true)}</span>`}<h1 class="${S.tela === 'inicio' ? '' : ''}">${TITULO[S.tela]}</h1>${topRight()}</header><div class="content">${TELAS[S.tela]()}</div></div>${tabs}`
}
function logo(compacto) {
  const svg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="6" y="2.5" width="12" height="19" rx="3.2" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3.6" stroke="#b8e35a" stroke-width="1.6"/><path d="M8.4 12h7.2M12 8.4c1.4 1.6 1.4 5.6 0 7.2M12 8.4c-1.4 1.6-1.4 5.6 0 7.2" stroke="#b8e35a" stroke-width="1.2"/></svg>`
  return `<span class="logo" ${compacto ? 'data-ir="inicio"' : ''}>${svg}</span>`
}
function topRight() {
  if (S.tela === 'clientes') return `<button class="btn b-pri b-sm" data-folha="novoCliente">${ic('user-plus', 'i-sm')}Cliente</button>`
  if (S.tela === 'vendas' && S.opAba === 'emp') return `<button class="btn b-pri b-sm" data-folha="novoEmprestimo">${ic('plus', 'i-sm')}Empréstimo</button>`
  if (S.tela === 'caixa') return `<button class="btn b-pri b-sm" data-folha="movimento">${ic('arrow-left-right', 'i-sm')}Lançar</button>`
  if (S.tela === 'indicadores') return `<button class="btn b-pri b-sm" data-folha="novoIndicador">${ic('plus', 'i-sm')}Indicador</button>`
  if (S.tela === 'equipe') return `<button class="btn b-pri b-sm" data-folha="convite">${ic('user-plus', 'i-sm')}Convidar</button>`
  if (S.tela === 'estoque') return `<button class="btn b-pri b-sm" data-folha="novoAparelho">${ic('plus', 'i-sm')}Aparelho</button>`
  if (S.tela === 'vendas') return `<button class="btn b-pri b-sm" data-ir="vender">${ic('plus', 'i-sm')}Venda</button>`
  if (S.tela === 'inicio') return `<button class="btn b-pri b-sm so-pc" data-ir="vender">${ic('plus', 'i-sm')}Vender</button>`
  return ''
}

// ----- Início -----
function telaInicio() {
  const cob = cobrancas().filter((x) => !x.p.pago)
  const hoje = cob.filter((x) => x.p.venc === HOJE)
  const atras = cob.filter((x) => x.p.venc < HOJE)
  const prox = cob.filter((x) => x.p.venc > HOJE).sort((a, b) => a.p.venc.localeCompare(b.p.venc))
  const sem7 = prox.filter((x) => diasEntre(HOJE, x.p.venc) <= 7)
  const doMes = vendas.filter((v) => v.data.slice(0, 7) === HOJE.slice(0, 7))
  const lucroMes = [...vendas, ...emprestimos].reduce((s, v) => s + contasOp(v).lucroRealizado, 0)
  const disp = bens.filter((b) => b.estado === 'DISPONIVEL')
  const parados = disp.map((b) => ({ b, dias: diasEntre(b.desde, HOJE) })).sort((a, b) => b.dias - a.dias)
  const capParado = disp.reduce((s, b) => s + investido(b), 0)
  const valorHoje = hoje.reduce((s, x) => s + faltaP(x.p), 0) + sem7.reduce((s, x) => s + faltaP(x.p), 0)
  const atrasoV = atras.reduce((s, x) => s + faltaP(x.p), 0)

  return `<div class="inicio"><div class="col">
    <section class="hero">
      <div class="between"><span class="lbl">Bom dia, Geovane · quarta, 8 de outubro</span></div>
      <div><div class="lbl">Pra receber esta semana</div><div class="big disp num">${fmt(valorHoje)}</div>
      <div class="lbl" style="margin-top:2px">${hoje.length + sem7.length} parcelas · ${atras.length ? `<b style="color:#ffd6cf">${fmt(atrasoV)} atrasado</b>` : 'nada atrasado'}</div></div>
      <div class="acts"><button class="btn gold" data-ir="cobrancas">${ic('hand-coins', 'i-sm')}Ver cobranças</button><button class="btn" data-ir="vender">${ic('plus', 'i-sm')}Nova venda</button></div>
    </section>
    <div class="kpis">
      <button data-ir="vendas"><div class="lbl">Vendas no mês</div><div class="val num">${doMes.length || 0}</div><div class="small">${doMes.length ? fmt0(doMes.reduce((s, v) => s + contas(v).total, 0)) : 'nenhuma ainda'}</div></button>
      <div><div class="lbl">Lucro no bolso</div><div class="val num" style="color:var(--ok)">${fmt0(lucroMes)}</div><div class="small">após o capital</div></div>
      <button data-ir="estoque"><div class="lbl">No estoque</div><div class="val num">${fmt0(capParado)}</div><div class="small">${disp.length} aparelhos</div></button>
    </div>
    <div class="sec-t"><h2>Atrasadas</h2><button data-ir="cobrancas">Ver todas</button></div>
    <div class="card list">${atras.length ? atras.slice(0, 4).map(cobLinha).join('') : '<div class="empty">Ninguém atrasado 🎉</div>'}</div>
  </div><div class="col">
    <div class="sec-t"><h2>Estoque parado há mais tempo</h2><button data-ir="estoque">Estoque</button></div>
    <div class="card list">${parados.slice(0, 3).map(({ b, dias }) => `
      <button class="li" data-bem="${b.id}">${miniFone(b)}<div class="mid"><div class="t">${b.modelo} · ${b.gb} GB</div><div class="s">${b.cor} · custo ${fmt0(investido(b))}</div></div>
      <span class="chip ${dias > 30 ? 'c-warn' : 'c-neu'}">${dias} dias</span></button>`).join('')}</div>
    <div class="sec-t"><h2>Próximos vencimentos</h2></div>
    <div class="card list">${prox.slice(0, 4).map(cobLinha).join('')}</div>
  </div></div>`
}
function miniFone(b) { return `<span class="pic" style="width:38px;height:38px;border-radius:10px;background:var(--elevated);border:1px solid var(--border);display:grid;place-items:center;position:relative;flex:none">${ic('smartphone', 'i-sm')}<span style="position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-radius:50%;background:${CORES[b.cor] || '#999'};box-shadow:0 0 0 1.5px var(--surface)"></span></span>` }

function cobLinha(x) {
  const atraso = !x.p.pago && x.p.venc < HOJE ? diasEntre(x.p.venc, HOJE) : 0
  const hoje = x.p.venc === HOJE
  const parcial = !x.p.pago && pagoP(x.p) > 0

function foneCard(b) {

// ----- Vender -----
function simular(nv) {
  const b = nv.bemId ? bem(nv.bemId) : null
  const troca = nv.temTroca ? Number(nv.trocaValor) || 0 : 0
  const entrada = Number(nv.entrada) || 0
  const preco = Number(nv.preco) || 0
  const financiado = Math.max(0, preco - entrada - troca)
  const pl = planoParc(financiado, nv.n), parc = pl.parc
  const total = entrada + troca + pl.total
  const inv = b ? investido(b) : 0
  const p = parceiro(nv.parceiroId)
  const lucro = total - inv
  const parteParc = lucro > 0 ? lucro * p.pct : 0
  const seu = lucro - parteParc
  // em qual parcela o capital volta
  let acum = entrada + troca, volta = acum >= inv ? 0 : null
  for (let i = 1; i <= nv.n && volta === null; i++) { acum += parc; if (acum >= inv) volta = i }
  return { b, troca, entrada, preco, financiado, parc, total, inv, p, lucro, parteParc, seu, volta, margem: total ? lucro / total : 0 }
}

  } else if (nv.passo === 2) {

      <div style="display:flex;flex-direction:column;gap:8px">${lista.map((c) => {

      }).join('')}
      <button class="opt" data-folha="novoCliente">${ic('user-plus')}<span style="font-weight:600;color:var(--primary)">Cadastrar cliente novo</span></button></div>
      <button class="btn b-pri b-block" data-passo="3" ${nv.clienteId ? '' : 'disabled style="opacity:.5"'}>Continuar</button>`
  } else {

    corpo = `<div class="vender-grid"><div style="display:flex;flex-direction:column;gap:16px">
      <div class="card pad row" style="gap:12px">${miniFone(r.b)}<div style="flex:1;min-width:0"><div class="val">${r.b.modelo} · ${r.b.gb} GB · ${r.b.cor}</div><div class="small">para ${cliente(nv.clienteId).nome}</div></div><button class="btn b-ghost b-sm" data-passo="1">Trocar</button></div>
      <div class="grid2">
        <div class="field"><label>Preço de venda</label><div class="inp"><span>R$</span><input class="money" inputmode="numeric" data-nv="preco" value="${moneyBR(nv.preco)}"></div></div>
        <div class="field"><label>Entrada</label><div class="inp"><span>R$</span><input class="money" inputmode="numeric" data-nv="entrada" value="${moneyBR(nv.entrada)}"></div></div>
      </div>
      <div class="card pad" style="display:flex;flex-direction:column;gap:12px">
        <button class="toggle" data-toggle-troca><span style="flex:1"><span class="val" style="display:block">Cliente dá um aparelho na troca</span><span class="small">O aparelho entra no seu estoque e abate do preço</span></span><span class="sw ${nv.temTroca ? 'on' : ''}"></span></button>
        ${nv.temTroca ? `<div class="grid2"><div class="field"><label>Aparelho dele</label><div class="inp"><input data-nv="trocaModelo" value="${nv.trocaModelo}" style="font-size:14px"></div></div><div class="field"><label>Você avalia em</label><div class="inp"><span>R$</span><input class="money" inputmode="numeric" data-nv="trocaValor" value="${moneyBR(nv.trocaValor)}"></div></div></div>` : ''}
      </div>
      <div class="field"><label>Parcelas</label><div class="pills">${Array.from({ length: JUROS.max }, (_, i) => i + 1).map((n) => `<button class="pill ${nv.n === n ? 'on' : ''}" data-n="${n}">${n}x</button>`).join('')}</div></div>
      <div class="field"><label>Vence todo dia</label><div class="pills">${[5, 10, 15, 20, 25].map((d) => `<button class="pill ${nv.dia === d ? 'on' : ''}" data-dia="${d}">${d}</button>`).join('')}</div></div>
      <div class="field"><label>Veio por indicação?</label><div class="pills">${parceiros.map((p) => `<button class="pill ${nv.parceiroId === p.id ? 'on' : ''}" data-parc="${p.id}">${p.id ? `${p.nome.split(' ')[0]} ${Math.round(p.pct * 100)}%` : 'Não'}</button>`).join('')}</div></div>
    </div>
    <div class="card pad sim" id="sim">${simCard(r, nv)}</div></div>`
  }
  return `${steps}${corpo}`

function simCard(r, nv) {

// ----- Cobranças -----
function telaCobrancas() {
  const base = cobrancas()
  const todas = S.cobTipo === 'todos' ? base : base.filter((x) => (x.v.tipo === 'EMP') === (S.cobTipo === 'emp'))
  const abertas = todas.filter((x) => !x.p.pago)
  const grupos = {
    atrasadas: abertas.filter((x) => x.p.venc < HOJE).sort((a, b) => a.p.venc.localeCompare(b.p.venc)),
    hoje: abertas.filter((x) => x.p.venc >= HOJE && diasEntre(HOJE, x.p.venc) <= 7).sort((a, b) => a.p.venc.localeCompare(b.p.venc)),
    proximas: abertas.filter((x) => diasEntre(HOJE, x.p.venc) > 7 && diasEntre(HOJE, x.p.venc) <= 45).sort((a, b) => a.p.venc.localeCompare(b.p.venc)),
    recebidas: todas.filter((x) => x.p.pagos.some((g) => g.data >= '2026-09-08')).sort((a, b) => b.p.pagos.at(-1).data.localeCompare(a.p.pagos.at(-1).data)),
  }
  const ABAS = [['atrasadas', 'Atrasadas'], ['hoje', 'Esta semana'], ['proximas', 'Próximas'], ['recebidas', 'Recebidas']]
  const lista = grupos[S.cobAba]
  const total = lista.reduce((s, x) => s + (S.cobAba === 'recebidas' ? pagoP(x.p) : faltaP(x.p)), 0)
  const legenda = { atrasadas: 'em atraso', hoje: 'vence nos próximos 7 dias', proximas: 'até o fim de novembro', recebidas: 'nos últimos 30 dias' }[S.cobAba]
  const atrN = (f) => new Set(base.filter((x) => !x.p.pago && x.p.venc < HOJE && f(x)).map((x) => x.v.id)).size
  return `${abasTipo([['todos', 'Tudo', 'layers', atrN(() => true)], ['iphone', 'iPhones', 'smartphone', atrN((x) => x.v.tipo !== 'EMP')], ['emp', 'Empréstimos', 'landmark', atrN((x) => x.v.tipo === 'EMP')]], S.cobTipo, 'cobtipo')}<div class="filtros"><span class="seg">${ABAS.map(([v, l]) => `<button class="${S.cobAba === v ? 'on' : ''}" data-cob="${v}">${l}${grupos[v].length && v !== 'recebidas' ? ` · ${grupos[v].length}` : ''}</button>`).join('')}</span></div>
    <div class="card"><div class="totbar"><span class="small">${lista.length} ${lista.length === 1 ? 'parcela' : 'parcelas'} ${legenda}</span><b class="num" style="font-size:16px;color:${S.cobAba === 'atrasadas' ? 'var(--bad)' : S.cobAba === 'recebidas' ? 'var(--ok)' : 'var(--strong)'}">${fmt(total)}</b></div>
    <div class="list">${lista.length ? lista.map(cobLinha).join('') : '<div class="empty">Nada aqui.</div>'}</div></div>`
}

function recParcela() { const v = opById(S.rec.vid); return v.parcelas.find((x) => x.n === S.rec.n) }
// Paga a parcela escolhida; o que passar abate das próximas, em ordem. O que faltar fica aberto ou vira desconto.
let S_ultimoTx = 0
function registrar(v, n, data, valor, forma, resto, por = quemRecebe()) {
  let sobra = valor; const tx = ++seq; S_ultimoTx = tx
  for (const p of v.parcelas.filter((x) => x.n >= n && !x.pago)) {
    if (sobra <= 0.009) break
    const parte = Math.min(sobra, faltaP(p))
    p.pagos.push({ data, valor: Math.round(parte * 100) / 100, forma, por, tx }); sobra -= parte
    if (faltaP(p) <= 0.009) p.pago = data
  }
  const alvo = v.parcelas.find((x) => x.n === n)
  if (resto === 'DESCONTO' && !alvo.pago && faltaP(alvo) > 0) { alvo.desconto += faltaP(alvo); alvo.pago = data }
}
function vencPadraoResto(p) { return p.venc > HOJE ? p.venc : addDia(HOJE, 7) }
function novoVencRec(p, dif) {
  const r = S.rec, nv = r.novoVenc ||= vencPadraoResto(p)
  const ops = [...(p.venc > HOJE ? [[p.venc, `Manter ${dmy(p.venc)}`]] : []), [addDia(HOJE, 3), '+3 dias'], [addDia(HOJE, 7), '+7 dias'], [addDia(HOJE, 15), '+15 dias']]
  return `<div class="field" style="padding:2px 4px 4px 34px"><label>Quando ele paga os ${fmt(dif)} que faltam?</label>
    <div class="pills">${ops.map(([d, l]) => `<button class="pill ${nv === d ? 'on' : ''}" data-rec-nv="${d}">${l}</button>`).join('')}
      <div class="inp" style="height:36px;flex:1;min-width:150px"><input type="date" id="recNovoVenc" value="${nv}" min="${HOJE}" style="font-size:14px"></div></div>
    <div class="small">${nv === p.venc ? 'O vencimento continua o mesmo.' : `A ${p.n}ª passa a vencer ${dmyA(nv)}${p.venc < HOJE ? ' e sai dos atrasados' : ''}. A cobrança e o lembrete vão nessa data.`}</div></div>`
}
function planoRec() {
  const r = S.rec, v = opById(r.vid), p = recParcela(), valor = numBR(r.valor), falta = faltaP(p)
  if (valor <= 0) return '<div class="small">Informe quanto o cliente pagou.</div>'
  if (Math.abs(valor - falta) < 0.01) return `<div class="chip c-ok" style="white-space:normal">Quita a ${p.n}ª parcela</div>`
  if (valor < falta) {
    const dif = falta - valor
    return `<div class="lbl" style="margin-bottom:6px">Faltaram ${fmt(dif)}. O que fazer?</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="opt ${r.resto === 'FICA' ? 'on' : ''}" data-rec-resto="FICA"><span class="radio"></span><span><span class="val" style="display:block">Fica devendo nesta parcela</span><span class="small">A ${p.n}ª continua aberta com ${fmt(dif)} pra pagar</span></span></button>
        ${r.resto === 'FICA' ? novoVencRec(p, dif) : ''}
        <button class="opt ${r.resto === 'DESCONTO' ? 'on' : ''}" data-rec-resto="DESCONTO"><span class="radio"></span><span><span class="val" style="display:block">${ehCobrador() ? `Pedir desconto de ${fmt(dif)}` : `Dar desconto de ${fmt(dif)}`}</span><span class="small">${ehCobrador() ? 'Vai pro Geovane aprovar. Até lá a parcela fica aberta' : `A ${p.n}ª fica quitada. Desconto sai do seu lucro`}</span></span></button>
      </div>`
  }
  // pagou a mais: abate das próximas
  let sobra = valor - falta; const efeitos = []
  for (const q of v.parcelas.filter((x) => x.n > p.n && !x.pago)) {
    if (sobra <= 0.009) break
    const parte = Math.min(sobra, faltaP(q)); efeitos.push(parte >= faltaP(q) - 0.009 ? `quita a ${q.n}ª` : `abate ${fmt(parte)} da ${q.n}ª`); sobra -= parte
  }
  return `<div class="chip c-pri" style="white-space:normal;line-height:1.4;padding:6px 10px">Quita a ${p.n}ª e o que passou (${fmt(valor - falta)}) ${efeitos.join(', ') || 'fica de crédito'}</div>`
}
function atualizarRec() { const el = document.getElementById('planoRec'); if (el) el.innerHTML = planoRec() }

// ---------- cobrador ----------
function cHoje() {
  const u = eu(), abertas = cobDaCarteira(u.id).filter((x) => !x.p.pago)

      ${meta ? `<div class="bar" style="margin-top:6px;background:rgba(255,255,255,.18)"><i style="width:${Math.min(100, Math.round(totRec / (meta + totRec) * 100))}%;background:var(--gold)"></i></div>` : ''}</div>
    ${bloco('Atrasadas', atr, 'var(--bad)')}${bloco('Vencem hoje', hoje, 'var(--warn)')}${bloco('Próximos 7 dias', sem, 'var(--strong)')}

// 10% e até 10x: em 10x o cliente paga o dobro do que ficou pra parcelar.
const JUROS = { pct: 10, max: 10 }
function planoParc(fin, n) {
  const total = Math.round(fin * (1 + JUROS.pct / 100 * n) * 100) / 100
  return { total, parc: n > 0 ? Math.ceil(total / n * 100) / 100 : 0, juros: total - fin }
}
function simDados() {
  const s = S.sim, b = s.bemId ? bem(s.bemId) : null
  const preco = numBR(s.preco), entrada = Math.min(numBR(s.entrada), preco), fin = Math.max(0, preco - entrada)
  const linhas = Array.from({ length: JUROS.max }, (_, i) => { const n = i + 1, pl = planoParc(fin, n); return { n, ...pl, totalCli: entrada + pl.total, lucro: b ? entrada + pl.total - investido(b) : null } })
  return { s, b, preco, entrada, fin, linhas }
}

    marcaTema()
}

function atualizarSim() {

// ---------- ações ----------
// ----- campo de data com calendário -----
// Troca todo <input type="date"> por: texto dd/mm/aaaa + botão que abre um calendário.
// O input original vira hidden (mesmo id e valor ISO) e recebe um evento 'input', então quem já ouvia continua igual.
const isoBR = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '')
function brIso(t) { const m = t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null; const iso = `${m[3]}-${m[2]}-${m[1]}`, d = new Date(iso + 'T12:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === iso ? iso : null }
function melhorarDatas() {
  document.querySelectorAll('input[type="date"]').forEach((h) => {
    const box = h.closest('.inp'); if (!box) return
    h.type = 'hidden'; box.classList.add('dp')
    const txt = document.createElement('input')
    Object.assign(txt, { className: 'dtxt', value: isoBR(h.value), placeholder: 'dd/mm/aaaa', inputMode: 'numeric' }); txt.setAttribute('aria-label', 'Data (dd/mm/aaaa)')
    txt.style.fontSize = h.style.fontSize || '15px'
    const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'dcal'; bt.dataset.dpAbrir = ''; bt.setAttribute('aria-label', 'Abrir calendário'); bt.innerHTML = ic('calendar-days', 'i-sm')
    box.insertBefore(txt, h); box.insertBefore(bt, h.nextSibling)
  })
}
function dpEscolher(h, iso) {
  if (h.min && iso < h.min) iso = h.min
  if (h.max && iso > h.max) iso = h.max
  h.value = iso; const txt = h.parentElement.querySelector('.dtxt'); if (txt) txt.value = isoBR(iso)
  dpFechar(); h.dispatchEvent(new Event('input', { bubbles: true }))
}
function dpFechar() { document.querySelectorAll('.dpop').forEach((x) => x.remove()) }
function dpDesenhar(box, ym) {
  const h = box.querySelector('input[type="hidden"]'), sel = h.value
  let pop = box.querySelector('.dpop'); if (!pop) { pop = document.createElement('div'); pop.className = 'dpop'; box.appendChild(pop) }
  pop.dataset.ym = ym
  const [y, m] = ym.split('-').map(Number), primeiro = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), dias = new Date(Date.UTC(y, m, 0)).getUTCDate()
  const cel = Array.from({ length: primeiro }, () => '<span></span>')
  for (let d = 1; d <= dias; d++) {
    const iso = `${ym}-${String(d).padStart(2, '0')}`, fora = (h.min && iso < h.min) || (h.max && iso > h.max)
    cel.push(`<button type="button" class="${iso === sel ? 'on' : ''} ${iso === HOJE ? 'hoje' : ''}" data-dp-dia="${iso}" ${fora ? 'disabled' : ''}>${d}</button>`)
  }
  const pode = (iso) => !((h.min && iso < h.min) || (h.max && iso > h.max))
  const mais30 = somaDias(HOJE, 30)
  pop.innerHTML = `<div class="dhead"><button type="button" data-dp-mes="-1" aria-label="Mês anterior">${ic('chevron-left', 'i-sm')}</button><b>${mesLabel(ym)}</b><button type="button" data-dp-mes="1" aria-label="Próximo mês">${ic('chevron-right', 'i-sm')}</button></div>
    <div class="dgrid">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((x) => `<span>${x}</span>`).join('')}${cel.join('')}</div>
    <div class="dfoot">${pode(HOJE) ? `<button type="button" data-dp-dia="${HOJE}">Hoje</button>` : '<span></span>'}${pode(mais30) ? `<button type="button" data-dp-dia="${mais30}">Daqui a 30 dias</button>` : ''}</div>`
  pop.style.left = '-1px'; const r = pop.getBoundingClientRect(), lim = document.documentElement.clientWidth - 12
  if (r.right > lim) pop.style.left = `${-1 - (r.right - lim)}px`
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-dp-abrir],[data-dp-dia],[data-dp-mes]')
  if (!b) { if (!e.target.closest('.dpop')) dpFechar(); return }
  e.stopPropagation(); e.preventDefault()
  const box = b.closest('.inp'), h = box.querySelector('input[type="hidden"]')
  if ('dpAbrir' in b.dataset) { const aberto = box.querySelector('.dpop'); dpFechar(); if (!aberto) { dpDesenhar(box, (h.value || HOJE).slice(0, 7)); box.querySelector('.dpop').scrollIntoView({ block: 'nearest', behavior: 'smooth' }) } return }
  if (b.dataset.dpMes) { dpDesenhar(box, somaYm(box.querySelector('.dpop').dataset.ym, Number(b.dataset.dpMes))); return }
  if (b.dataset.dpDia) dpEscolher(h, b.dataset.dpDia)
}, true)
document.addEventListener('input', (e) => {
  const t = e.target; if (!t.classList?.contains('dtxt')) return
  e.stopPropagation()
  const dg = t.value.replace(/\D/g, '').slice(0, 8)
  t.value = dg.length > 4 ? `${dg.slice(0, 2)}/${dg.slice(2, 4)}/${dg.slice(4)}` : dg.length > 2 ? `${dg.slice(0, 2)}/${dg.slice(2)}` : dg
  const iso = brIso(t.value); if (iso) dpEscolher(t.parentElement.querySelector('input[type="hidden"]'), iso)
}, true)
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.querySelector('.dpop')) { e.stopImmediatePropagation(); dpFechar() } }, true)
new MutationObserver(melhorarDatas).observe(document.body, { childList: true, subtree: true })
melhorarDatas()
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-ov], [data-ir]')
  if (!t) return
  const d = t.dataset
  if ('ov' in d) { if (e.target === t) fechar(); return }
  if (cliquesSim(t, d) || cliquesEquipe(t, d) || cliquesNovos(t, d)) return
  if (d.ir) { if ('nova' in d) S.nv = null; ir(d.ir); return }
  if (d.mais) { ir(d.mais); return }
  if (d.opaba) { S.opAba = d.opaba; render(); return }
  if (d.cobtipo) { S.cobTipo = d.cobtipo; render(); return }
  if (d.folha) { abrir(d.folha); return }
  if ('fechar' in d) { fechar(); return }
  if (d.bem) { abrir('bem', Number(d.bem)); return }
  if (d.venda) { const o = opById(Number(d.venda)); abrir(o.tipo === 'EMP' ? 'emprestimo' : 'venda', o.id); return }
  if (d.wa) { abrir('wa', d.wa); return }
  if (d.estoque) { S.estoqueFiltro = d.estoque; render(); return }
  if (d.cob) { S.cobAba = d.cob; render(); return }
  if (d.vf) { S.vendasFiltro = d.vf; render(); return }
  if (d.venderBem) { S.folha = null; S.nv = null; S.tela = 'vender'; novaVenda(Number(d.venderBem)); render(); return }
  if (d.receber) {
    const [vid, n] = d.receber.split(':').map(Number), v = opById(vid), p = v.parcelas.find((x) => x.n === n)
    S.rec = { vid, n, data: HOJE, valor: faltaP(p), forma: 'Pix', resto: 'FICA' }
    abrir('receber'); return
  }
  if (d.recData) { S.rec.data = d.recData === 'ontem' ? '2026-10-07' : HOJE; abrir('receber'); return }
  if (d.recValor) { const p = recParcela(); S.rec.valor = d.recValor === 'cheio' ? faltaP(p) : Math.round(faltaP(p) / 2 * 100) / 100; abrir('receber'); return }
  if (d.recForma) { S.rec.forma = d.recForma; abrir('receber'); return }
  if (d.recResto) { S.rec.resto = d.recResto; atualizarRec(); return }
  if (d.recNv) { S.rec.novoVenc = d.recNv; atualizarRec(); return }
  if ('recConfirmar' in d) {
    const r = S.rec, v = opById(r.vid), valor = numBR(r.valor)
    if (valor <= 0) return
    const antes = JSON.stringify(v.parcelas), alvo = v.parcelas.find((x) => x.n === r.n), i0 = alvo.pagos.length
    const pedeDesc = ehCobrador() && r.resto === 'DESCONTO'
    registrar(v, r.n, r.data, valor, r.forma, pedeDesc ? 'FICA' : r.resto)
    if (!pedeDesc && r.resto === 'FICA' && !alvo.pago && r.novoVenc && r.novoVenc !== alvo.venc) { alvo.vencOrig ??= alvo.venc; alvo.venc = r.novoVenc }
    if (pedeDesc) { const dif = faltaP(alvo); aprovacoes.push({ id: ++seq, tipo: 'Desconto', por: S.eqUid, quando: 'agora', texto: `${fmt(dif)} de desconto na ${alvo.n}ª parcela de ${cliente(v.clienteId).nome} (${nomeItem(v)})`, motivo: 'Pediu na hora do recebimento', acao: () => { alvo.desconto += faltaP(alvo); if (faltaP(alvo) <= 0.009) alvo.pago = HOJE } }) }
    S.folha = { tipo: 'recibo', arg: `${v.id}:${S_ultimoTx}` }; render()
    toast(`${cliente(v.clienteId).nome.split(' ')[0]} pagou ${fmt(valor)}`, () => { v.parcelas = JSON.parse(antes); if (S.folha?.tipo === 'recibo') S.folha = null; render() })
    return
  }
  if ('desfazer' in d) { const f = S.toast?.desfazer; S.toast = null; f?.(); return }
  if (d.retomar) {
    const v = opById(Number(d.retomar)); v.status = 'RETOMADA'; const b = bem(v.bemId); b.estado = 'DISPONIVEL'; b.desde = HOJE; b.origem = 'TROCA'
    S.folha = null; render(); toast('Aparelho voltou pro estoque'); return
  }
  if ('copiar' in d) {
    const txt = document.getElementById('msgWa').textContent
    navigator.clipboard?.writeText(txt).then(() => toast('Mensagem copiada'), () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('msgWa')); getSelection().removeAllRanges(); getSelection().addRange(r) })
    return
  }
  if (d.tema) { localSet('cf-proto-tema', d.tema); document.documentElement.dataset.theme = d.tema; marcaTema(); return }
  if (d.perfil) { if (d.perfil === 'indicador') { S.modo = 'indicador'; S.portalPid ||= 1; S.pTela = 'inicio' } else S.modo = null; S.folha = null; render(); document.querySelector('.main')?.scrollTo(0, 0); return }
  if (d.verComo) { if (d.verComo === 'indicador') { S.modo = 'indicador'; S.portalPid ||= 1; S.pTela = 'inicio' } else { S.modo = null; S.tela = 'inicio' } S.folha = null; render(); return }
  if (d.modo) { document.getElementById('stage').classList.toggle('celular', d.modo === 'celular'); document.querySelectorAll('[data-modo]').forEach((b) => b.classList.toggle('on', b.dataset.modo === d.modo)); return }
  // vender
  const nv = S.nv
  if (d.passo && nv) { nv.passo = Number(d.passo); render(); document.querySelector('.main')?.scrollTo(0, 0); return }
  if (d.escolherBem) { nv.bemId = Number(d.escolherBem); const b = bem(nv.bemId); if (!nv.precoFixo) { nv.preco = b.preco; nv.entrada = Math.round(b.preco * 0.15 / 50) * 50 } render(); return }
  if (d.escolherCli) { nv.clienteId = Number(d.escolherCli); render(); return }
  if ('toggleTroca' in d) { nv.temTroca = !nv.temTroca; render(); return }
  if (d.n) { nv.n = Number(d.n); render(); return }
  if (d.dia) { nv.dia = Number(d.dia); render(); return }
  if (d.parc !== undefined) { nv.parceiroId = Number(d.parc); render(); return }
  if ('confirmar' in d) {
    const r = simular(nv)
    if (nv.temTroca && r.troca > 0) { const [modelo, ...resto] = nv.trocaModelo.split(/ (?=\d+\s*GB)/i); bens.push({ id: ++seq, modelo: modelo.trim(), gb: parseInt(resto.join('')) || 64, cor: '—', bateria: 80, cond: 'Seminovo', imei: '', custo: r.troca, extras: 0, preco: Math.round(r.troca * 1.6 / 50) * 50, estado: 'DISPONIVEL', desde: HOJE, origem: 'TROCA' }) }
    const v = criarVenda({ bemId: nv.bemId, clienteId: nv.clienteId, data: HOJE, entrada: r.entrada, troca: r.troca, n: nv.n, valorParc: r.parc, dia: nv.dia, parceiroId: nv.parceiroId, contrato: 'AGUARDANDO' })
    vendas.push(v); bem(nv.bemId).estado = 'VENDIDO'; nv.feito = v.id; render(); document.querySelector('.main')?.scrollTo(0, 0); return
  }
  // folhas de cadastro
  if (d.fm) { document.querySelectorAll('[data-fm]').forEach((b) => b.classList.toggle('on', b === t)); return }
  if (d.fg) { document.querySelectorAll('[data-fg]').forEach((b) => b.classList.toggle('on', b === t)); return }
  if ('salvarAparelho' in d) {
    const val = (id) => document.getElementById(id).value
    bens.push({ id: ++seq, modelo: document.querySelector('[data-fm].on').dataset.fm, gb: Number(document.querySelector('[data-fg].on').dataset.fg), cor: val('fCor') || '—', bateria: Number(val('fBat')) || 100, cond: 'Seminovo', imei: val('fImei'), custo: numBR(val('fCusto')), extras: 0, preco: numBR(val('fPreco')), estado: 'DISPONIVEL', desde: HOJE, origem: 'COMPRA' })
    S.folha = null; S.estoqueFiltro = 'DISPONIVEL'; render(); toast('Aparelho no estoque'); return
  }
  if ('salvarCliente' in d) {
    const nome = document.getElementById('cNome').value.trim(); if (!nome) return
    const c = { id: ++seq, nome, fone: document.getElementById('cFone').value || '—', desde: HOJE, resp: 1 }; clientes.push(c); S.folha = null; if (S.tela === 'vender' && nv) { nv.clienteId = c.id; render() } else { S.clienteId = c.id; ir('cliente') } return
  }
})
