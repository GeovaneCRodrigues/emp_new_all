  <title id="mdi-c-t">Mundo dos iPhones</title>
  <!-- símbolo (igual ao logo-simbolo.svg) -->
  <defs>
  <!-- tile: verde escuro no canto inferior esquerdo, mais claro no superior direito -->
  <linearGradient id="mdi-c-g" x1="0" y1="1" x2="1" y2="0">
  <stop offset="0" stop-color="#0a3a27"/>
  <stop offset=".55" stop-color="#0f8f5f"/>
  <stop offset="1" stop-color="#3db572"/>
  </linearGradient>
  <radialGradient id="mdi-c-b" cx="1" cy="0" r="1">
  <stop offset="0" stop-color="#b8e35a" stop-opacity=".28"/>
  <stop offset=".6" stop-color="#b8e35a" stop-opacity="0"/>
  </radialGradient>
  <!-- tela: um pouco mais escura que o tile para a moldura branca e o lime saltarem -->
  <linearGradient id="mdi-c-t2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0a4530"/>
  <stop offset="1" stop-color="#0f7a50"/>
  </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#mdi-c-g)"/>
  <rect width="64" height="64" rx="15" fill="url(#mdi-c-b)"/>
