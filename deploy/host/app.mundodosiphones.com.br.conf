# Mundo dos iPhones: o nginx do servidor recebe 80/443 e repassa para o container (127.0.0.1:5180).
# O certificado HTTPS é adicionado pelo certbot (bloco 443 e redirecionamento).
server {
  listen 80;
  listen [::]:80;
  server_name app.mundodosiphones.com.br;
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:5180;
    proxy_set_header Host $host;
    # sobrescreve (não acrescenta): o cliente não consegue forjar o próprio IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
