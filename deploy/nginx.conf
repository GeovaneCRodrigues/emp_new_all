server {
  listen 80;
  # atrás do nginx do servidor (rede do Docker): confia no IP real que ele manda. Pedido vindo de fora não é confiável e não vale.
  set_real_ip_from 172.20.0.0/16;
  real_ip_header X-Real-IP;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  location /api/ {
    # a API manda os próprios cabeçalhos (helmet)
    proxy_pass http://back:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # sobrescreve (não acrescenta): o cliente não consegue forjar o IP que o back usa no limite de tentativas
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }

  # arquivos com hash no nome podem ficar em cache; o index.html nunca
  # o service worker e o manifesto nunca ficam em cache, para o app se atualizar
  location = /sw.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
  location /assets/ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
