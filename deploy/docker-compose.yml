# Mundo dos iPhones em produção, ao lado do sistema antigo (rede, volume e porta próprios).
# Fica em /opt/mundo_iphones junto de um .env (POSTGRES_PASSWORD, JWT_SECRET, ORIGEM e, se usar o ZapSign, TOKEN_ZAPSIGN, ZAPSIGN_SANDBOX, ZAPSIGN_FACIAL, ZAPSIGN_WEBHOOK_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY) que NÃO vai para o git.
name: mundo-iphones-prod
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mundo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: mundo_iphones
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mundo -d mundo_iphones']
      interval: 5s
      retries: 10
  back:
    build: { context: ./back, dockerfile: ../Dockerfile.back }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://mundo:${POSTGRES_PASSWORD}@postgres:5432/mundo_iphones
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      CORS_ORIGIN: ${ORIGEM:?defina no .env}
      # ZapSign (opcional): sem TOKEN_ZAPSIGN fica desligado e o contrato assina pelo link próprio.
      # ZAPSIGN_SANDBOX=true usa o ambiente de teste (outro token); só false vale como contrato de verdade.
      TOKEN_ZAPSIGN: ${TOKEN_ZAPSIGN:-}
      ZAPSIGN_SANDBOX: ${ZAPSIGN_SANDBOX:-true}
      # facial de quem assina: nenhuma | selfie | liveness (liveness é pago e precisa estar liberado na conta do ZapSign).
      ZAPSIGN_FACIAL: ${ZAPSIGN_FACIAL:-nenhuma}
      ZAPSIGN_WEBHOOK_SECRET: ${ZAPSIGN_WEBHOOK_SECRET:-}
      # Avisos no celular (push): sem as chaves VAPID fica desligado.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@mundodosiphones.com.br}
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [back]
    ports:
      - '5180:80'
    volumes:
      - ./front-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
volumes:
  pgdata:
